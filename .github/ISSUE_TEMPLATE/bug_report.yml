name: Bug report
description: Report a bug to help us improve Open Food Facts
title: ''
type: '🐛 bug'
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! Please search existing issues first to avoid duplicates.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Web (Desktop)
        - Web (Mobile)
        - Android
        - iOS
        - Backend / API / CLI
        - Other
    validations:
      required: false
  - type: input
    id: environment
    attributes:
      label: OS / Browser / App version
      description: "e.g. Ubuntu 24.04 + Firefox 130, iOS 18, App v4.12"
  - type: textarea
    id: screenshots-logs
    attributes:
      label: Screenshots or logs
      description: If applicable, add screenshots, console output, or error logs to help explain the problem.
  - type: input
    id: part-of
    attributes:
      label: Part of
      description: Add the parent issue number preceded by `#` (e.g. `#374`), if applicable.
